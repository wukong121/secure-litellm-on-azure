apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-api
spec:
  rules:
    - host: llm-api.example.com
      http:
        paths:
          - path: /readyz
            pathType: Exact
            backend:
              service: {name: llm-api-proxy, port: {name: http}}
          - path: /chat/completions
            pathType: Exact
            backend:
              service: {name: llm-api-proxy, port: {name: http}}
          - path: /v1/chat/completions
            pathType: Exact
            backend:
              service: {name: llm-api-proxy, port: {name: http}}
          - path: /responses
            pathType: Exact
            backend:
              service: {name: llm-api-proxy, port: {name: http}}
          - path: /v1/responses
            pathType: Exact
            backend:
              service: {name: llm-api-proxy, port: {name: http}}
          - path: /embeddings
            pathType: Exact
            backend:
              service: {name: llm-api-proxy, port: {name: http}}
          - path: /v1/embeddings
            pathType: Exact
            backend:
              service: {name: llm-api-proxy, port: {name: http}}