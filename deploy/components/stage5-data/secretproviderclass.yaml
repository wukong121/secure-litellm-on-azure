apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: litellm-key-vault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: REPLACE_FROM_PROTECTED_DEPLOYMENT_OUTPUT
    keyvaultName: REPLACE_FROM_PROTECTED_DEPLOYMENT_OUTPUT
    tenantId: REPLACE_FROM_PROTECTED_DEPLOYMENT_OUTPUT
    objects: |
      array:
        - |
          objectName: litellm-master-key
          objectAlias: LITELLM_MASTER_KEY
          objectType: secret
        - |
          objectName: litellm-salt-key
          objectAlias: LITELLM_SALT_KEY
          objectType: secret
        - |
          objectName: litellm-database-url
          objectAlias: DATABASE_URL
          objectType: secret
  secretObjects:
    - secretName: litellm-runtime-secrets
      type: Opaque
      data:
        - objectName: LITELLM_MASTER_KEY
          key: LITELLM_MASTER_KEY
        - objectName: LITELLM_SALT_KEY
          key: LITELLM_SALT_KEY
        - objectName: DATABASE_URL
          key: DATABASE_URL
