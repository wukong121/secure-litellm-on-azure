apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: llm-admin-auth
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: REPLACE_ADMIN_PROXY_CLIENT_ID
    keyvaultName: REPLACE_ADMIN_AUTH_VAULT_NAME
    tenantId: REPLACE_ENTRA_TENANT_ID
    objects: |
      array:
        - |
          objectName: llm-admin-oidc-client-secret
          objectAlias: oidc-client-secret
          objectType: secret
          filePermission: "0440"
        - |
          objectName: llm-admin-session-key
          objectAlias: session-key
          objectType: secret
          filePermission: "0440"
        - |
          objectName: REPLACE_PER_IDENTITY_ADMIN_KEY_SECRET
          objectAlias: admin-user-key
          objectType: secret
          filePermission: "0440"