name: Customer gateway isolation checks

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [dev, test, prod]

permissions:
  contents: read

concurrency:
  group: customer-change-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    steps:
      - name: Require private protected default branch
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$PRIVATE_REPOSITORY" == true ]]
          [[ "$CURRENT_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
  check:
    needs: authorize
    environment: ${{ inputs.environment }}
    runs-on: ${{ fromJSON(vars.MIGRATION_PRIVATE_RUNNER_LABELS) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - name: Verify DNS, TLS and anonymous request rejection
        env:
          CUSTOMER_CONFIG_JSON: ${{ secrets.CUSTOMER_CONFIG_JSON || vars.CUSTOMER_CONFIG_JSON }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
        run: python -m scripts.gateway_checks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() || failure()
        with:
          name: gateway-checks-${{ inputs.environment }}-${{ github.run_id }}
          path: temp/gateway-checks/gateway-isolation.json
          if-no-files-found: error
          retention-days: 7
      - if: always()
        run: rm -rf -- temp/gateway-checks