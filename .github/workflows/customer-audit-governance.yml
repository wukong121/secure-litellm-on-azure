name: Customer audit governance

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [dev, test, prod]
      action:
        type: choice
        required: true
        options: [grant, revoke, hold, release-hold]
      actor_object_id:
        description: Entra Object ID of the requester or raw-access recipient
        type: string
        required: true
      record_id:
        description: Audit request ID for holds; approval ID for revoke; leave empty for grant
        type: string
      ticket:
        type: string
        required: true
      reason:
        type: string
        required: true
      teams:
        description: Exact comma-separated team IDs for grant
        type: string
      from:
        description: Grant query start time with UTC offset
        type: string
      to:
        description: Grant query end time with UTC offset
        type: string
      until:
        description: Access or hold expiry with UTC offset
        type: string

permissions:
  contents: read

concurrency:
  group: customer-change-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    environment: ${{ inputs.environment }}
    runs-on: ${{ fromJSON(vars.MIGRATION_PRIVATE_RUNNER_LABELS) }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require private protected default branch
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$PRIVATE_REPOSITORY" == true ]]
          [[ "$CURRENT_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 cryptography==50.0.1 service-identity==24.2.0 'psycopg[binary]==3.2.10' azure-identity==1.25.1 azure-keyvault-secrets==4.10.0
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_AUDIT_GOVERNANCE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Plan metadata-only registry change
        env:
          CUSTOMER_CONFIG_JSON: ${{ secrets.CUSTOMER_CONFIG_JSON || vars.CUSTOMER_CONFIG_JSON }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
          AUDIT_ACTION: ${{ inputs.action }}
          AUDIT_ACTOR_ID: ${{ inputs.actor_object_id }}
          AUDIT_RECORD_ID: ${{ inputs.record_id }}
          AUDIT_TICKET: ${{ inputs.ticket }}
          AUDIT_REASON: ${{ inputs.reason }}
          AUDIT_TEAMS: ${{ inputs.teams }}
          AUDIT_FROM: ${{ inputs.from }}
          AUDIT_TO: ${{ inputs.to }}
          AUDIT_UNTIL: ${{ inputs.until }}
        run: python -m scripts.audit_governance --operation plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-governance-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: temp/audit-governance/governance-plan.json
          retention-days: 7
          if-no-files-found: error
      - if: always()
        run: rm -rf -- temp/audit-governance
  first-approval:
    needs: plan
    environment: ${{ inputs.environment }}-audit-approval-1
    runs-on: ubuntu-24.04
    steps:
      - run: printf '%s\n' 'First independent audit review completed.'
  second-approval:
    needs: first-approval
    environment: ${{ inputs.environment }}-audit-approval-2
    runs-on: ubuntu-24.04
    steps:
      - run: printf '%s\n' 'Second independent audit review completed.'
  publish:
    needs: second-approval
    environment: ${{ inputs.environment }}
    runs-on: ${{ fromJSON(vars.MIGRATION_PRIVATE_RUNNER_LABELS) }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 cryptography==50.0.1 service-identity==24.2.0 'psycopg[binary]==3.2.10' azure-identity==1.25.1 azure-keyvault-secrets==4.10.0
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_AUDIT_GOVERNANCE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify two actual reviewers and publish registry
        env:
          CUSTOMER_CONFIG_JSON: ${{ secrets.CUSTOMER_CONFIG_JSON || vars.CUSTOMER_CONFIG_JSON }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.audit_governance --operation execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-governance-receipt-${{ inputs.environment }}-${{ github.run_id }}
          path: temp/audit-governance/governance-receipt.json
          retention-days: 7
          if-no-files-found: error
      - if: always()
        run: rm -rf -- temp/audit-governance