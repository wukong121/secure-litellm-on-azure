name: Customer private runner checks

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [dev, test, prod]
      check_target:
        description: Also test target AKS read access after it has been deployed
        type: boolean
        default: false
      check_backup:
        description: Test approved backup resources, private DNS/TLS and runtime Blob read access after network preparation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: customer-change-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    steps:
      - name: Require manual execution of the protected default branch
        env:
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_PROTECTED" == true ]]
          [[ "$CURRENT_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
  check:
    needs: authorize
    environment: ${{ inputs.environment }}
    runs-on: ${{ fromJSON(vars.MIGRATION_PRIVATE_RUNNER_LABELS) }}
    timeout-minutes: 15
    env:
      WORKFLOW_ARTIFACT_KEY: ${{ secrets.WORKFLOW_ARTIFACT_KEY }}
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 cryptography==50.0.1 service-identity==24.2.0 'psycopg[binary]==3.2.10' azure-identity==1.25.1 azure-keyvault-secrets==4.10.0
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_RUNTIME_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Inspect tools, identity and selected cluster access without changes
        env:
          CUSTOMER_CONFIG_JSON: ${{ secrets.CUSTOMER_CONFIG_JSON }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
          CHECK_TARGET: ${{ inputs.check_target }}
          CHECK_BACKUP: ${{ inputs.check_backup }}
        run: |
          arguments=(--environment "$CUSTOMER_ENVIRONMENT")
          if [[ "$CHECK_TARGET" == true ]]; then arguments+=(--check-target); fi
          if [[ "$CHECK_BACKUP" == true ]]; then arguments+=(--check-backup); fi
          python -m scripts.workflow_security run scripts.installation_readiness "${arguments[@]}"
      - name: Encrypt readiness results
        if: success() || failure()
        env:
          ARTIFACT_NAME: runner-checks-${{ inputs.environment }}-${{ github.run_id }}
        run: python -m scripts.workflow_security seal --directory temp/runner-readiness --name "$ARTIFACT_NAME" runner-readiness.json operation-status.json
      - name: Save encrypted readiness results
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-checks-${{ inputs.environment }}-${{ github.run_id }}
          path: temp/runner-readiness/sealed-artifact.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove private kubeconfig and diagnostics
        if: always()
        run: rm -rf -- temp/runner-readiness temp/workflow-private