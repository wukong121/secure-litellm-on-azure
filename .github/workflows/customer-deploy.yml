name: Customer infrastructure deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [dev, test, prod]
      stage:
        type: choice
        required: true
        options: ['0', '1', '3', '4', '5', '7', '8', '9']
      component:
        type: choice
        required: true
        options: [bootstrap, network, backup, legacy-logging, monitoring, platform, proxy-foundation, audit-foundation, audit, observability, origin, edge]
      operation:
        type: choice
        required: true
        options: [plan, deploy]
      release:
        description: Stage 9 edge traffic operation with a separately reviewed release report
        type: boolean
        default: false
      approved_plan_sha256:
        description: Legacy direct hash input; prefer approved_run_id
        type: string
      approved_run_id:
        description: Successful matching infrastructure plan run ID
        type: string
      confirm_environment:
        description: Type the selected environment again for deploy
        type: string

permissions:
  contents: read

concurrency:
  group: customer-change-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    steps:
      - name: Require private customer repository and default branch
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$PRIVATE_REPOSITORY" == true ]] || { echo 'Use a customer-controlled private repository.' >&2; exit 1; }
          [[ "$CURRENT_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo 'Run reviewed code from the protected default branch.' >&2; exit 1; }
  infrastructure:
    needs: authorize
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - name: Check plan artifact reader
        run: command -v gh
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure Bicep compiler
        run: az bicep install
      - name: Plan or execute the reviewed component
        env:
          CUSTOMER_CONFIG_JSON: ${{ secrets.CUSTOMER_CONFIG_JSON || vars.CUSTOMER_CONFIG_JSON }}
          MIGRATION_EVIDENCE_JSON: ${{ secrets.MIGRATION_EVIDENCE_JSON }}
          MIGRATION_AUTO_EVIDENCE: 'true'
          MIGRATION_APPROVED_RUN_ID: ${{ inputs.approved_run_id }}
          GH_TOKEN: ${{ github.token }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          MIGRATION_APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
          MIGRATION_CONFIRM_ENVIRONMENT: ${{ inputs.confirm_environment }}
          MIGRATION_RELEASE_JSON: ${{ secrets.MIGRATION_RELEASE_JSON }}
          RELEASE_REQUESTED: ${{ inputs.release }}
          MIGRATION_OPERATION: ${{ inputs.operation }}
          MIGRATION_STAGE: ${{ inputs.stage }}
          MIGRATION_COMPONENT: ${{ inputs.component }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          arguments=()
          if [[ "$RELEASE_REQUESTED" == true ]]; then arguments+=(--release); fi
          python -m scripts.migration_deploy --operation "$MIGRATION_OPERATION" \
            --stage "$MIGRATION_STAGE" --component "$MIGRATION_COMPONENT" \
            --environment "$CUSTOMER_ENVIRONMENT" "${arguments[@]}"
      - name: Save private reviewed plan and deployment outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infrastructure-${{ inputs.environment }}-${{ inputs.stage }}-${{ inputs.component }}-${{ github.run_id }}
          path: |
            temp/migration-deploy/plan-summary.json
            temp/migration-deploy/reviewed-plan.json
            temp/migration-deploy/operation-receipt.json
            temp/migration-deploy/deployment-receipt.json
            temp/migration-deploy/deployment-outputs.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove private plans and diagnostics
        if: always()
        run: rm -rf -- temp/migration-deploy