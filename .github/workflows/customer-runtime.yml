name: Customer private runtime operations

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [dev, test, prod]
      stage:
        type: choice
        required: true
        options: ['0', '1', '4', '5', '6', '7', '8', '9']
      action:
        type: choice
        required: true
        options: [backup-restore, legacy-hardening, cluster-bootstrap, private-ingress, certificate-renew, monitoring-onboard, database-roles, backend-secrets, restore-target, schema-migrate, entra-apps, entra-access, entra-revoke, admin-credentials, admin-credentials-rotate, admin-credentials-recover, admin-credentials-session-rotate, admin-credentials-retire-expired, proxy-credentials, application, audit-pause, audit-recover, audit-resume, dns-publish, dns-rollback]
      operation:
        type: choice
        required: true
        options: [plan, execute]
      approved_plan_sha256:
        description: Non-audit runtime plan SHA256; audit actions use approved_run_id
        type: string
      approved_run_id:
        description: Successful matching plan run ID to approve for execute
        type: string
      audit_continue_run_id:
        description: Optional previous audit-recover plan run ID for the next page
        type: string
      confirm_environment:
        description: Type the environment again for execute
        type: string

permissions:
  contents: read

concurrency:
  group: customer-change-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    steps:
      - name: Require private repository and protected default branch
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$PRIVATE_REPOSITORY" == true ]] || { echo 'Use a customer-controlled private repository.' >&2; exit 1; }
          [[ "$CURRENT_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo 'Run reviewed code from the protected default branch.' >&2; exit 1; }
  runtime:
    needs: authorize
    environment: ${{ inputs.environment }}
    runs-on: ${{ fromJSON(vars.MIGRATION_PRIVATE_RUNNER_LABELS) }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 cryptography==50.0.1 service-identity==24.2.0 'psycopg[binary]==3.2.10' azure-identity==1.25.1 azure-keyvault-secrets==4.10.0
      - name: Install fixed API certificate protocol dependencies
        if: inputs.action == 'certificate-renew'
        run: python -m pip install acme==5.8.0 dnspython==2.8.0 josepy==2.2.0
      - name: Check private runner tools
        run: |
          command -v az
          command -v kubectl
          command -v kubelogin
      - name: Check private ingress tools
        if: inputs.action == 'private-ingress'
        run: |
          command -v openssl
          command -v skopeo
          command -v trivy
          command -v syft
      - name: Require separately authorized database identity
        if: inputs.action == 'database-roles'
        env:
          DATABASE_CLIENT_ID: ${{ vars.AZURE_DATABASE_CLIENT_ID }}
        run: test -n "$DATABASE_CLIENT_ID" || { echo 'Configure the approved database administrator OIDC client ID.' >&2; exit 1; }
      - name: Check schema migration container runtime
        if: inputs.action == 'schema-migrate'
        run: |
          command -v docker
          docker version --format '{{.Server.Version}}'
      - name: Check managed application verification tools
        if: inputs.action == 'application' || inputs.action == 'audit-recover'
        run: command -v cosign
      - name: Check audit plan artifact reader
        run: command -v gh
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        if: inputs.action != 'entra-apps' && !startsWith(inputs.action, 'admin-credentials') && inputs.action != 'entra-access' && inputs.action != 'entra-revoke' && inputs.action != 'certificate-renew'
        with:
          client-id: ${{ inputs.action == 'database-roles' && vars.AZURE_DATABASE_CLIENT_ID || vars.AZURE_RUNTIME_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Require approved Entra bootstrap identity
        if: inputs.action == 'entra-apps' || startsWith(inputs.action, 'admin-credentials')
        env:
          ENTRA_CLIENT_ID: ${{ vars.AZURE_ENTRA_CLIENT_ID }}
        run: test -n "$ENTRA_CLIENT_ID" || { echo 'Configure the approved Entra application bootstrap OIDC identity.' >&2; exit 1; }
      - name: Require separate certificate identity
        if: inputs.action == 'certificate-renew'
        env:
          CERTIFICATE_CLIENT_ID: ${{ vars.AZURE_CERTIFICATE_CLIENT_ID }}
        run: test -n "$CERTIFICATE_CLIENT_ID" || { echo 'Configure the approved DNS challenge and API certificate Vault identity.' >&2; exit 1; }
      - name: Sign in with certificate identity
        if: inputs.action == 'certificate-renew'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CERTIFICATE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in with Entra bootstrap identity
        if: inputs.action == 'entra-apps' || startsWith(inputs.action, 'admin-credentials')
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_ENTRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Require separately approved access grant identity
        if: inputs.action == 'entra-access' || inputs.action == 'entra-revoke'
        env:
          ENTRA_ACCESS_CLIENT_ID: ${{ vars.AZURE_ENTRA_ACCESS_CLIENT_ID }}
        run: test -n "$ENTRA_ACCESS_CLIENT_ID" || { echo 'Configure the separately approved Entra access grant OIDC identity.' >&2; exit 1; }
      - name: Sign in with access grant identity
        if: inputs.action == 'entra-access' || inputs.action == 'entra-revoke'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_ENTRA_ACCESS_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Execute bounded private operation
        env:
          CUSTOMER_CONFIG_JSON: ${{ secrets.CUSTOMER_CONFIG_JSON || vars.CUSTOMER_CONFIG_JSON }}
          AZURE_ENTRA_CLIENT_ID: ${{ vars.AZURE_ENTRA_CLIENT_ID }}
          AZURE_ENTRA_ACCESS_CLIENT_ID: ${{ vars.AZURE_ENTRA_ACCESS_CLIENT_ID }}
          MIGRATION_EVIDENCE_JSON: ${{ secrets.MIGRATION_EVIDENCE_JSON }}
          MIGRATION_AUTO_EVIDENCE: 'true'
          MIGRATION_MANIFEST_YAML: ${{ secrets.MIGRATION_MANIFEST_YAML }}
          POSTGRES_RESTORE_IMAGE: ${{ vars.POSTGRES_RESTORE_IMAGE }}
          POSTGRES_MIGRATION_USER: ${{ vars.POSTGRES_MIGRATION_USER }}
          MIGRATION_RESTORE_BLOB: ${{ vars.MIGRATION_RESTORE_BLOB }}
          MIGRATION_BACKUP_SHA256: ${{ vars.MIGRATION_BACKUP_SHA256 }}
          PRIVATE_API_INGRESS_CLASS: ${{ vars.PRIVATE_API_INGRESS_CLASS }}
          PRIVATE_ADMIN_INGRESS_CLASS: ${{ vars.PRIVATE_ADMIN_INGRESS_CLASS }}
          MIGRATION_CONFIRM_ENVIRONMENT: ${{ inputs.confirm_environment }}
          MIGRATION_APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
          MIGRATION_APPROVED_RUN_ID: ${{ inputs.approved_run_id }}
          AUDIT_CONTINUE_RUN_ID: ${{ inputs.audit_continue_run_id }}
          GH_TOKEN: ${{ github.token }}
          MIGRATION_ACTION: ${{ inputs.action }}
          MIGRATION_OPERATION: ${{ inputs.operation }}
          MIGRATION_STAGE: ${{ inputs.stage }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
        run: >-
          python -m scripts.migration_runtime --action "$MIGRATION_ACTION"
          --operation "$MIGRATION_OPERATION" --stage "$MIGRATION_STAGE"
          --environment "$CUSTOMER_ENVIRONMENT"
      - name: Save pending report or runtime metadata only
        if: success() || (failure() && startsWith(inputs.action, 'audit-'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ inputs.environment }}-${{ inputs.stage }}-${{ github.run_id }}
          path: |
            temp/migration-runtime/runtime-summary.json
            temp/migration-runtime/runtime-review.json
            temp/migration-runtime/operation-receipt.json
            temp/migration-runtime/acceptance-report.json
            temp/migration-runtime/backend-access.json
            temp/migration-runtime/proxy-policy.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove local backups, kubeconfig and private diagnostics
        if: always()
        run: rm -rf -- temp/migration-runtime