name: Check public source image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require reviewed default branch
        env:
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: '[[ "$CURRENT_REF" == "refs/heads/$DEFAULT_BRANCH" ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install configuration parser
        run: python -m pip install PyYAML==6.0.3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
      - name: Check locked source without Azure credentials
        run: python -m scripts.source_supply_chain --revision "$GITHUB_SHA"
      - name: Publish source evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-image-${{ github.run_id }}
          path: |
            temp/source-supply-chain/source-summary.json
            temp/source-supply-chain/source-sbom.spdx.json
            temp/source-supply-chain/source-scan.json
          if-no-files-found: error
          retention-days: 7